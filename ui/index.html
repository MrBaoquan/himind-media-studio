<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>自媒体创作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var shown = false;
        function show(message) {
          if (shown) return;
          shown = true;
          var panel = document.createElement('div');
          panel.id = 'plugin-load-error';
          panel.setAttribute('role', 'alert');
          panel.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0a1220;color:#e9e6df;font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:24px;';
          panel.innerHTML = '<div style="width:min(560px,92vw);border:1px solid #2a3448;border-radius:14px;background:#111a2b;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.45)">'
            + '<div style="font-size:13px;letter-spacing:.14em;color:#9a9ca8;text-transform:uppercase">Plugin UI</div>'
            + '<div style="margin-top:6px;font-size:22px;font-weight:650">创作台界面加载失败</div>'
            + '<div id="plugin-load-error-message" style="margin-top:10px;font-size:12.5px;line-height:1.65;color:#b8bcc8;word-break:break-word"></div>'
            + '<div style="margin-top:8px;font-size:11.5px;line-height:1.6;color:#8f93a1">界面资源可能暂时不可用。重试会重新加载当前窗口；如果仍然失败，请关闭窗口后从主窗口重新打开创作台。</div>'
            + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">'
            + '<button id="plugin-load-close" type="button" style="height:32px;padding:0 14px;border:1px solid #3a4458;border-radius:8px;background:transparent;color:#e9e6df;font:inherit;font-size:12px;cursor:pointer">关闭窗口</button>'
            + '<button id="plugin-load-retry" type="button" style="height:32px;padding:0 16px;border:1px solid #5aa9ff;border-radius:8px;background:#3f6fd8;color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer">重试</button>'
            + '</div></div>';
          document.body.appendChild(panel);
          var messageNode = panel.querySelector('#plugin-load-error-message');
          if (messageNode) messageNode.textContent = message || '未知加载错误';
          var retry = panel.querySelector('#plugin-load-retry');
          if (retry) retry.addEventListener('click', function () { location.reload(); });
          var close = panel.querySelector('#plugin-load-close');
          if (close) close.addEventListener('click', function () { window.close(); });
        }
        window.__himindShowPluginLoadError = show;
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            show('资源加载失败：' + (target.src || target.href || 'unknown'));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          show('界面初始化失败：' + ((reason && reason.message) || reason || 'unknown'));
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.children.length === 0) show('创作台界面未能在预期时间内完成加载。');
        }, 8000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
